name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # CI FLOW
  # =========================
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      # Step 1 - Download source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2 - Install Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Step 3 - Build Spring Boot application
      - name: Build Application
        run: mvn clean package -DskipTests

      # Step 4 - Login to Docker Hub
      - name: Docker Hub Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" \
          --password-stdin

      # Step 5 - Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t nandhakumar638/springboot-cicd-demo:latest .

      # Step 6 - Push image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push nandhakumar638/springboot-cicd-demo:latest


  # =========================
  # CD FLOW
  # =========================
  deploy:

    # deploy job starts only after build job success
    needs: build-and-push

    # self-hosted runner = your laptop/server
    runs-on: self-hosted

    steps:

      # Step 1 - Download latest repo code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2 - Deploy to Minikube
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deploy.yaml

      # Step 3 - Restart deployment for latest image
      - name: Restart Deployment
        run: |
          kubectl rollout restart deployment springboot-cicd-deployment

      # Step 4 - Verify deployment
      - name: Verify Pods
        run: |
          kubectl get pods
